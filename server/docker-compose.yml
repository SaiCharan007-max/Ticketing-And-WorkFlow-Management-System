services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=ticketing_system
      - REDIS_HOST=redis
      - PORT=5000
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ticketing_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./src/db/seeds.sql:/docker-entrypoint-initdb.d/2-seeds.sql

  redis:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  postgres_data:
